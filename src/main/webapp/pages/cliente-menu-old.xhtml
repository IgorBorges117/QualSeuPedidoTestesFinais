<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <meta charset="UTF-8"/>
    <title>Menu do Chef</title>
</h:head>

<h:body>

<h1>Menu Disponível</h1>

<!-- precisa de form para os botões funcionarem -->
<h:form>

    <h:dataTable value="#{pratoBean.pratos}" var="p">

        <h:column>
            <f:facet name="header">Nome</f:facet>
            #{p.nome}
        </h:column>

        <h:column>
            <f:facet name="header">Descrição</f:facet>
            #{p.descricao}
        </h:column>

        <h:column>
            <f:facet name="header">Preço</f:facet>
            R$ #{p.preco}
        </h:column>

        <h:column>
            <f:facet name="header">Ação</f:facet>
            <h:commandButton value="Selecionar"
                             action="#{clientePedidoBean.adicionar(p.nome, p.preco)}"/>
        </h:column>

    </h:dataTable>

    <hr/>

    <h2>Meu Pedido</h2>

    <ui:repeat value="#{clientePedidoBean.carrinho}" var="item">
        <p>#{item.nome} - R$ #{item.preco}</p>
    </ui:repeat>

    <p><strong>Total: R$ #{clientePedidoBean.total}</strong></p>

    <h:commandButton value="Enviar Pedido ao Chef"
                     action="#{clientePedidoBean.enviarPedido}"
                     rendered="#{not empty clientePedidoBean.carrinho}"/>

    <h:dataTable value="#{clientePedidoBean.carrinho}" var="i">

        <h:column>
            #{i.nome}
        </h:column>

        <h:column>
            R$ #{i.preco}
        </h:column>

    </h:dataTable>

    <h3>Total: R$ #{clientePedidoBean.total}</h3>

    <h:commandButton value="Enviar Pedido"
                     action="#{clientePedidoBean.enviarPedido}"/>


</h:form>

</h:body>
</html>

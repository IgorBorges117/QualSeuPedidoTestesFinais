<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <meta charset="UTF-8"/>
    <title>Cadastro de Pratos</title>
</h:head>

<h:body>

<h1>Meu Menu</h1>

<h:form>

    Nome:
    <h:inputText value="#{pratoBean.nome}"/>
    <br/><br/>

    Descrição:
    <h:inputText value="#{pratoBean.descricao}"/>
    <br/><br/>

    Preço:
    <h:inputText value="#{pratoBean.preco}"/>
    <br/><br/>

    <h:commandButton value="Adicionar"
                     action="#{pratoBean.adicionarPrato(authBean.usuarioLogado.id)}"/>

</h:form>

<br/><br/>

<h:dataTable value="#{pratoBean.pratosDoChef(authBean.usuarioLogado.id)}" var="p">

    <h:column>
        #{p.nome}
    </h:column>

    <h:column>
        #{p.descricao}
    </h:column>

    <h:column>
        R$ #{p.preco}
    </h:column>

</h:dataTable>

</h:body>
</html>

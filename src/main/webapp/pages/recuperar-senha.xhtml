<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
<h:head>
    <meta charset="UTF-8"/>
    <title>Recuperar senha</title>
    <h:outputStylesheet library="css" name="app.css"/>
</h:head>
<h:body>
    <div class="card-page">
        <section class="auth-card">
            <div class="auth-logo">SENHA</div>
            <h1 class="auth-title">Recuperar senha</h1>
            <p>Informe seu e-mail para receber instruções de recuperação.</p>

            <h:form>
                <h:inputText styleClass="field" pt:placeholder="Seu e-mail"/>
                <h:commandButton styleClass="btn-submit" value="Enviar instruções" action="/pages/login.xhtml?faces-redirect=true"/>
            </h:form>

            <div class="auth-links">
                <h:link value="Voltar para login" outcome="/pages/login.xhtml"/>
            </div>
        </section>
    </div>
</h:body>
</html>
